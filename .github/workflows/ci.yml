name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present."

      - name: Validate HTML
        run: |
          echo "Validating HTML..."
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML validation passed."

      - name: Build project
        run: |
          echo "Building static website..."
          mkdir -p build
          cp index.html style.css script.js build/
          echo "Build completed successfully."

      - name: Generate build logs
        run: |
          echo "================================"
          echo "CI BUILD SUMMARY"
          echo "================================"
          echo "Project: DevOps WebApp"
          echo "Build Status: SUCCESS"
          echo "Files built: index.html, style.css, script.js"
          echo "Build directory: build/"
          echo "================================"

      - name: Notify Slack - Success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"✅ *CI/CD Pipeline Successful*\nProject: DevOps WebApp\nBuild: Passed\nTests/Validation: Passed\nStatus: Ready for deployment"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack - Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"❌ *CI/CD Pipeline Failed*\nProject: DevOps WebApp\nPlease check the GitHub Actions build logs."}' \
            "$SLACK_WEBHOOK_URL"